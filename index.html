<!doctype html>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Player’s Handbook</title>
  <meta name="description" content="Races, classes, subclasses, spells, advancement and the gods for our homebrew campaign — searchable.">
  <script>
    /* Settings are applied before the page paints, so there is no flash of the wrong theme or size. */
    (function () {
      var KEY = 'hb-settings', root = document.documentElement;
      var DEFAULTS = { theme: 'system', text: 'normal', font: 'tome', spacing: 'normal', contrast: 'normal', texture: 'full', motion: 'system' };
      var dark = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;
      function read() {
        var s = {};
        try { s = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { s = {}; }
        var out = {};
        for (var k in DEFAULTS) out[k] = typeof s[k] === 'string' ? s[k] : DEFAULTS[k];
        return out;
      }
      function apply(s) {
        root.setAttribute('data-resolved', s.theme === 'light' || s.theme === 'dark' ? s.theme : (dark && dark.matches ? 'dark' : 'light'));
        for (var k in DEFAULTS) {
          if (k === 'theme') continue;
          if (s[k] === DEFAULTS[k]) root.removeAttribute('data-' + k); else root.setAttribute('data-' + k, s[k]);
        }
      }
      var current = read();
      apply(current);
      if (dark) {
        var onChange = function () { if (current.theme === 'system') apply(current); };
        if (dark.addEventListener) dark.addEventListener('change', onChange); else if (dark.addListener) dark.addListener(onChange);
      }
      window.HandbookSettings = {
        defaults: DEFAULTS,
        get: function () { return Object.assign({}, current); },
        set: function (patch) {
          current = Object.assign({}, current, patch);
          var saved = true;
          try { localStorage.setItem(KEY, JSON.stringify(current)); } catch (e) { saved = false; }
          apply(current);
          return saved;
        },
        reset: function () {
          current = Object.assign({}, DEFAULTS);
          try { localStorage.removeItem(KEY); } catch (e) {}
          apply(current);
        }
      };
    })();
  </script>
